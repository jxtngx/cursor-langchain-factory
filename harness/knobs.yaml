# Harness knobs. Harbor / LangSmith override via configurable / env.
# @init-langchain sets language and model.provider / model.id.
# Do not hardcode a vendor in make_graph.

schema_version: 1

language: unset   # python | typescript

prompt:
  id: default
  path: harness/prompts/system.md

model:
  # init_chat_model / initChatModel — provider-agnostic
  provider: unset   # openai | anthropic | google | xai | ollama | other
  id: unset         # e.g. anthropic:claude-sonnet-4-5
  temperature: 0

tools:
  - id: lookup_spec
    enabled: true
  - id: echo
    enabled: true

middleware:
  - id: trace
    enabled: true
    notes: LangSmith always-on
  - id: tool_error
    enabled: true
  - id: max_iterations
    enabled: true
    value: 8

checkpointer:
  kind: memory   # memory | sqlite | postgres
  thread_required: true

eval:
  langsmith_dataset: langchain-factory-smoke
  harbor_agent: langgraph
  harbor_plugin: langsmith
